<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vietnam Macro Report</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--ok:#4ade80;--err:#f87171;--border:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:1.45rem}header p{margin:0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin-bottom:8px}
textarea,input[type=text]{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px}
textarea{min-height:72px;resize:vertical}
.hints{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.hint{background:#0b1220;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--muted);cursor:pointer}
.hint:hover{color:var(--accent);border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
button{background:var(--accent);color:#0f172a;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5}button.secondary{background:transparent;color:var(--text);border:1px solid var(--border)}
#status{font-size:.85rem;color:var(--muted)}#status.ok{color:var(--ok)}#status.err{color:var(--err)}#status.loading{color:var(--accent)}
.small{font-size:.78rem;color:var(--muted);margin-top:4px}
.report-box{background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:18px;white-space:pre-wrap;font-size:.92rem;line-height:1.7;max-height:70vh;overflow:auto}
.dl a{color:var(--accent);margin-right:12px;font-size:.88rem}
.ind{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:12px 0}
.ind div{background:#0b1220;border:1px solid var(--border);border-radius:8px;padding:10px}
.ind .l{font-size:.7rem;color:var(--muted)}.ind .v{font-weight:700;color:var(--ok);font-size:1.05rem}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Báo cáo vĩ mô &amp; doanh nghiệp</h1>
  <p>Xuất báo cáo chữ + CSV chỉ số để nạp Excel phase 1 — không trả link tra cứu</p>
</header>

<div class="card">
  <label>Yêu cầu báo cáo</label>
  <textarea id="query" placeholder="VD: Báo cáo vĩ mô VN và bối cảnh thế giới, ngành ngân hàng"></textarea>
  <div class="hints">
    <span class="hint" data-q="Báo cáo tổng hợp vĩ mô Việt Nam và bối cảnh thế giới">Vĩ mô tổng hợp</span>
    <span class="hint" data-q="Báo cáo GDP CPI tín dụng XNK tỷ giá Việt Nam">Vĩ mô chi tiết</span>
    <span class="hint" data-q="Phân tích ngành và doanh nghiệp liên quan">Ngành &amp; DN</span>
  </div>
  <label style="margin-top:10px">Mã CK (tuỳ chọn)</label>
  <input type="text" id="ticker" placeholder="VNM, HPG, VCB..." maxlength="10"/>
  <div class="small">Có mã → thêm mục doanh nghiệp trong báo cáo</div>
  <div class="row">
    <button id="btnRun">Tạo báo cáo</button>
    <button id="btnFiles" class="secondary">File đã xuất</button>
    <span id="status"></span>
  </div>
</div>

<div class="card">
  <label>Báo cáo</label>
  <div id="result"><p style="color:var(--muted)">Chưa có. Bấm "Tạo báo cáo".</p></div>
</div>
<footer>Vietnam Macro Agent</footer>
</div>
<script>
const q=$("query"),t=$("ticker"),out=$("result"),st=$("status");
function $(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
document.querySelectorAll(".hint").forEach(el=>el.onclick=()=>q.value=el.dataset.q);

$("btnRun").onclick=async()=>{
  const query=q.value.trim(), ticker=t.value.trim().toUpperCase();
  if(!query&&!ticker){st.textContent="Nhập yêu cầu hoặc mã CK";st.className="err";return}
  $("btnRun").disabled=true;st.textContent="Đang tạo...";st.className="loading";
  out.innerHTML='<p style="color:var(--muted)">Đang thu thập số liệu và viết báo cáo...</p>';
  try{
    const body={query:query||("Báo cáo kèm mã "+ticker)};
    if(ticker) body.ticker=ticker;
    const res=await fetch("/api/v1/agent/run/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const data=await res.json();
    const r=data.result||data;
    // ONLY show report text — never raw JSON dump
    let html="";
    const report=r.report||r.summary||"";
    if(report) html+=`<div class="report-box">${esc(report)}</div>`;
    else html+=`<p style="color:var(--err)">Không có nội dung báo cáo trong phản hồi. Có thể server chưa deploy bản mới.</p>`;
    if(r.indicators&&Object.keys(r.indicators).length){
      html+='<div class="ind" style="margin-top:14px">';
      for(const [k,v] of Object.entries(r.indicators)){
        if(v==null||v===""||typeof v==="object") continue;
        html+=`<div><div class="l">${esc(k)}</div><div class="v">${esc(v)}</div></div>`;
      }
      html+="</div>";
    }
    const hints=(r.exports&&r.exports.download_hints)||[];
    if(hints.length){
      html+='<div class="dl" style="margin-top:12px"><b>Tải file nạp Excel:</b><br/>';
      hints.forEach(u=>{html+=`<a href="${esc(u)}" target="_blank">⬇ ${esc(u.split("/").pop())}</a>`;});
      html+="</div>";
    }
    if(r.notes) html+=`<p style="color:var(--muted);font-size:.85rem;margin-top:10px">${esc(r.notes)}</p>`;
    out.innerHTML=html;
    st.textContent=res.ok?"Hoàn thành":"Lỗi";st.className=res.ok?"ok":"err";
  }catch(e){out.innerHTML=`<p style="color:var(--err)">${esc(e)}</p>`;st.textContent="Lỗi kết nối";st.className="err"}
  finally{$("btnRun").disabled=false}
};

$("btnFiles").onclick=async()=>{
  try{
    const d=await(await fetch("/api/v1/reports/list")).json();
    let h=`<p><b>File (${d.count||0})</b></p><ul>`;
    (d.files||[]).forEach(f=>{
      const link=f.download||"#";
      h+=`<li><a href="${esc(link)}" style="color:var(--accent)" target="_blank">${esc(f.filename)}</a> <span style="color:var(--muted)">${esc(f.kind||"")}</span></li>`;
    });
    h+="</ul>";out.innerHTML=h;st.textContent="Danh sách file";st.className="ok";
  }catch(e){out.innerHTML=esc(e);st.className="err"}
};
</script>
</body>
</html>
