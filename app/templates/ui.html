<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vietnam Research Agent – Professional Desk</title>
  <style>
    :root {
      --primary: #0B3D5C;
      --accent: #1A6B9A;
      --bg: #F4F7FA;
      --card: #ffffff;
      --muted: #5A6A7A;
      --border: #D0D9E3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg); color: #1a1a1a; line-height: 1.5;
    }
    header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white; padding: 1.4rem 2rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    header h1 { margin: 0; font-size: 1.45rem; font-weight: 600; }
    header p { margin: .3rem 0 0; opacity: .9; font-size: .9rem; }
    .container { max-width: 920px; margin: 1.5rem auto; padding: 0 1.2rem; }
    .card {
      background: var(--card); border-radius: 10px; padding: 1.4rem 1.6rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06); border: 1px solid var(--border);
      margin-bottom: 1.2rem;
    }
    label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: .35rem; color: var(--primary); }
    input, select, textarea {
      width: 100%; padding: .55rem .7rem; border: 1px solid var(--border);
      border-radius: 6px; font-size: .95rem; margin-bottom: .9rem;
    }
    textarea { min-height: 90px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    button {
      background: var(--primary); color: white; border: none; padding: .7rem 1.4rem;
      border-radius: 6px; font-size: .95rem; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .btn-secondary { background: #e8eef4; color: var(--primary); }
    .status { font-size: .9rem; color: var(--muted); margin-top: .8rem; }
    .progress { background: #eef2f6; border-radius: 6px; padding: .8rem 1rem; font-size: .85rem; max-height: 160px; overflow-y: auto; }
    .progress div { padding: .15rem 0; border-bottom: 1px dashed #dde3ea; }
    .result-links a { display: inline-block; margin: .3rem .5rem .3rem 0; padding: .4rem .8rem; background: var(--accent); color: white; border-radius: 5px; text-decoration: none; font-size: .85rem; }
    .result-links a:hover { opacity: .9; }
    pre.report {
      background: #1e293b; color: #e2e8f0; padding: 1rem; border-radius: 8px;
      font-size: .82rem; max-height: 420px; overflow: auto; white-space: pre-wrap;
    }
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .75rem; font-weight: 600; }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .badge-partial { background: #fef3c7; color: #92400e; }
    .badge-fail { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <header>
    <h1>Vietnam Research Agent</h1>
    <p>Professional Macro & Corporate Research Desk · Báo cáo chuẩn ngân hàng thương mại</p>
  </header>

  <div class="container">
    <div class="card">
      <form id="form">
        <label>Yêu cầu phân tích (tiếng Việt hoặc Anh)</label>
        <textarea id="query" placeholder="Ví dụ: Phân tích sâu Vinamilk (VNM) năm 2024-2025, đánh giá định giá và rủi ro ngành sữa..." required></textarea>

        <div class="row">
          <div>
            <label>Tên công ty (bất kỳ – niêm yết hoặc chưa)</label>
            <input id="name" placeholder="Vinamilk / Công ty TNHH ABC..." />
          </div>
          <div>
            <label>Mã CK (nếu có)</label>
            <input id="ticker" placeholder="VNM, HPG, FPT..." />
          </div>
        </div>
        <div class="row">
          <div>
            <label>Mã số thuế (MST) – tùy chọn</label>
            <input id="tax_code" placeholder="0123456789" />
          </div>
          <div>
            <label>Độ sâu báo cáo</label>
            <select id="depth">
              <option value="quick">Quick (tóm tắt nhanh)</option>
              <option value="standard" selected>Standard (research note đầy đủ)</option>
              <option value="deep">Deep (phân tích chuyên sâu)</option>
            </select>
          </div>
        </div>

        <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem">
          <label style="display:flex;align-items:center;gap:.4rem;font-weight:500">
            <input type="checkbox" id="export_pdf" checked /> Xuất PDF
          </label>
          <label style="display:flex;align-items:center;gap:.4rem;font-weight:500">
            <input type="checkbox" id="export_excel" checked /> Xuất Excel
          </label>
          <label style="display:flex;align-items:center;gap:.4rem;font-weight:500">
            <input type="checkbox" id="include_macro" checked /> Kèm dữ liệu vĩ mô
          </label>
        </div>

        <button type="submit" id="btn">Chạy phân tích chuyên sâu</button>
        <span class="status" id="status"></span>
      </form>
    </div>

    <div class="card" id="progressCard" style="display:none">
      <strong>Tiến trình</strong>
      <div class="progress" id="progress"></div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem">
        <strong>Kết quả</strong>
        <span id="statusBadge"></span>
      </div>
      <div class="result-links" id="links"></div>
      <h4 style="margin:.8rem 0 .4rem;color:var(--primary)">Executive Summary</h4>
      <pre class="report" id="summary"></pre>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const statusEl = document.getElementById("status");
    const progressCard = document.getElementById("progressCard");
    const progressEl = document.getElementById("progress");
    const resultCard = document.getElementById("resultCard");
    const linksEl = document.getElementById("links");
    const summaryEl = document.getElementById("summary");
    const badgeEl = document.getElementById("statusBadge");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      statusEl.textContent = "Đang chạy... có thể mất 30–90 giây";
      progressCard.style.display = "block";
      resultCard.style.display = "none";
      progressEl.innerHTML = "";

      const company = {};
      if (document.getElementById("name").value.trim())
        company.name = document.getElementById("name").value.trim();
      if (document.getElementById("ticker").value.trim())
        company.ticker = document.getElementById("ticker").value.trim().toUpperCase();
      if (document.getElementById("tax_code").value.trim())
        company.tax_code = document.getElementById("tax_code").value.trim();

      const body = {
        query: document.getElementById("query").value.trim(),
        company: Object.keys(company).length ? company : null,
        depth: document.getElementById("depth").value,
        include_macro: document.getElementById("include_macro").checked,
        export_pdf: document.getElementById("export_pdf").checked,
        export_excel: document.getElementById("export_excel").checked,
      };

      try {
        const res = await fetch("/api/v1/research/run/sync", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json();

        if (data.progress && data.progress.length) {
          progressEl.innerHTML = data.progress.map(p => `<div>• ${p}</div>`).join("");
        }

        const st = data.status || "";
        badgeEl.className = "badge " + (st === "success" ? "badge-ok" : st === "partial" ? "badge-partial" : "badge-fail");
        badgeEl.textContent = st.toUpperCase();

        resultCard.style.display = "block";
        linksEl.innerHTML = "";
        const result = data.result || {};
        (result.download_hints || []).forEach(h => {
          const a = document.createElement("a");
          a.href = h;
          a.textContent = h.split("/").pop();
          a.target = "_blank";
          linksEl.appendChild(a);
        });

        summaryEl.textContent = result.executive_summary || data.message || "(không có tóm tắt)";
        statusEl.textContent = data.message || "Xong";
      } catch (err) {
        statusEl.textContent = "Lỗi: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
